<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="/assets/images/Simon_Game_Challenge.png" />
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
      integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  </head>

  <body>
    <h1 id="level-title">點擊任意鍵開始</h1>
    <h2 id="highest">最高分 : 0</h2>
    <div class="container">
      <div class="game-section">
        <div class="row">
          <div type="button" id="green" class="btn green"></div>
          <div type="button" id="red" class="btn red"></div>
        </div>
        <div class="row">
          <div type="button" id="yellow" class="btn yellow"></div>
          <div type="button" id="blue" class="btn blue"></div>
        </div>
      </div>
      <div class="instructions-section">
        <h2><u>遊戲說明</u></h2>
        <p>
          <b>目標：</b>記住並重複遊戲顯示的顏色序列。隨著遊戲進行，序列會越來越長。你的目標是準確地重現序列，以達到最高的等級。
        </p>
        <ol>
          <li>記住顯示的顏色序列。</li>
          <li>按照相同的順序點擊顏色。</li>
          <li>隨著遊戲進行，序列會越來越長。</li>
          <li>如果你出錯，遊戲將結束。</li>
        </ol>
        <h2>祝你好運 :)</h2>
      </div>
    </div>

    <h1 id="play-button">
      <i class="fa fa-regular fa-circle-play"></i>
    </h1>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
