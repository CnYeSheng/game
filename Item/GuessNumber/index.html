<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-size: 18px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            margin-top: 50px;
            min-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            color: #2196F3;
            margin-bottom: 30px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 15px 0;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        input, select {
            padding: 12px;
            margin: 15px 0;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 200px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2196F3;
        }
        #range {
            font-size: 1.2em;
            color: #666;
            margin: 15px 0;
        }
        #message {
            font-size: 1.2em;
            min-height: 1.5em;
            margin: 20px 0;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .game-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>猜數字遊戲</h1>
        <div class="game-controls">
            <select id="difficulty" onchange="setDifficulty(this.value)">
                <option value="easy">簡單 (1-50)</option>
                <option value="medium" selected>中等 (1-100)</option>
                <option value="hard">困難 (1-200)</option>
            </select>
            <p>請猜一個數字：</p>
            <p id="range">範圍：1 - 100</p>
            <input type="number" id="guessInput" min="1" max="100">
            <button onclick="checkGuess()" id="guessButton">猜！</button>
            <p id="message"></p>
            <button onclick="resetGame()">重新開始</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
