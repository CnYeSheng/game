<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骰子遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>骰子遊戲</h1>
        <div class="controls">
            <label for="diceCount">骰子數量：</label>
            <input type="number" id="diceCount" min="1" max="6" value="1">
        </div>
        <div class="dice-container" id="diceContainer">
            <div class="dice" id="dice-0">
                <div class="face front">
                    <span class="dot"></span>
                </div>
                <div class="face back">
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="face right">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="face left">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="face top">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="face bottom">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
        <button id="rollButton">擲骰子</button>
        <div id="results"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
