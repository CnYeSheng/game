<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真心話大冒險</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>真心話大冒險</h1>
        <div class="game-area">
            <div class="bottle-container">
                <img src="./bottle.png" alt="瓶子" id="bottle" class="bottle">
            </div>
            <div class="controls">
                <button id="spinButton">轉動瓶子</button>
                <div class="mode-select">
                    <button id="truthButton">真心話</button>
                    <button id="dareButton">大冒險</button>
                </div>
            </div>
            <div id="question" class="question-box"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
